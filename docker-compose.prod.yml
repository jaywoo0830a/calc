services:
  caddy:
    image: caddy:alpine
    container_name: calc-caddy
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # freedf nginx(호스트 8081)로 프록시용
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - calc

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
