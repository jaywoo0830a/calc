services:
  calc:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: calc
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: calc-api
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models
    volumes:
      - api_data:/app/data
      - api_models:/app/models

volumes:
  api_data:
    driver: local
  api_models:
    driver: local
