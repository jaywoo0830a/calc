<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Calc — High Precision (32 digits)</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="expression" id="expression">&nbsp;</div>
            <div class="result" id="result">0</div>
        </div>

        <div class="keypad">
            <div class="btn func" data-action="clear" role="button" tabindex="0">C</div>
            <div class="btn func" data-action="negate" role="button" tabindex="0">±</div>
            <div class="btn func" data-action="backspace" role="button" tabindex="0">⌫</div>
            <div class="btn op" data-action="operator" data-value="div" role="button" tabindex="0">÷</div>

            <div class="btn num" data-action="digit" data-value="7" role="button" tabindex="0">7</div>
            <div class="btn num" data-action="digit" data-value="8" role="button" tabindex="0">8</div>
            <div class="btn num" data-action="digit" data-value="9" role="button" tabindex="0">9</div>
            <div class="btn op" data-action="operator" data-value="mul" role="button" tabindex="0">×</div>

            <div class="btn num" data-action="digit" data-value="4" role="button" tabindex="0">4</div>
            <div class="btn num" data-action="digit" data-value="5" role="button" tabindex="0">5</div>
            <div class="btn num" data-action="digit" data-value="6" role="button" tabindex="0">6</div>
            <div class="btn op" data-action="operator" data-value="sub" role="button" tabindex="0">−</div>

            <div class="btn num" data-action="digit" data-value="1" role="button" tabindex="0">1</div>
            <div class="btn num" data-action="digit" data-value="2" role="button" tabindex="0">2</div>
            <div class="btn num" data-action="digit" data-value="3" role="button" tabindex="0">3</div>
            <div class="btn op" data-action="operator" data-value="add" role="button" tabindex="0">+</div>

            <div class="btn num zero" data-action="digit" data-value="0" role="button" tabindex="0">0</div>
            <div class="btn num" data-action="decimal" data-value="." role="button" tabindex="0">.</div>
            <div class="btn eq" data-action="equals" role="button" tabindex="0">=</div>
        </div>

        <div class="footer">
            <p class="info">32-digit precision &middot; truncated (PHP BCMATH style)</p>
            <div class="mute-toggle" id="muteBtn" role="button" tabindex="0" aria-label="Toggle sound" title="Toggle sound">🔊</div>
        </div>
    </div>

    <script src="/js/decimal.js"></script>
    <script src="app.js"></script>
</body>
</html>
