server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/html;
    gzip_min_length 256;

    # scanic ML 자산 — .mjs는 모듈 스크립트 MIME 필수 (동적 import)
    location /scanic-ml/ {
        types {
            application/javascript mjs;
            application/wasm wasm;
            application/octet-stream ort;
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
