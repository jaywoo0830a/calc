server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── 전송 최적화: sendfile + TCP_NODELAY/NOPUSH + keepalive ──────────
    sendfile on;
    sendfile_max_chunk 2m;      # 큰 파일도 클라이언트 봉쇄 없이 블록 단위 전송
    tcp_nopush on;              # 헤더+본문 세그먼트 통합 (소형 파일 왕복 수 감소)
    tcp_nodelay on;             # Nagle 비활성 — 지연 최소화
    keepalive_timeout 75;       # keepalive 연결 유지 → 반복 요청 3-way 핸드셰이크 생략
    keepalive_requests 1000;
    server_tokens off;

    # ── gzip 압축: 전송 바이트 감소 = 실질 다운로드 속도 향상 ────────────
    gzip on;
    gzip_vary on;               # Vary: Accept-Encoding
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_static on;             # 미리 생성된 .gz 파일이 있으면 그대로 서빙(CPU 0)
    gzip_types
        text/plain
        text/css
        # text/html 은 gzip 기본값이라 생략(명시 시 'duplicate MIME type' 경고)
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        # scanic ML 자산 — .wasm 런타임 / .ort 모델을 압축해 다운로드량 축소
        application/wasm
        application/octet-stream;
    gzip_disable "msie6";

    # ── scanic ML 자산 — .mjs는 모듈 스크립트 MIME 필수 (동적 import) ────
    # 큰 모델/런타임은 자주 안 바뀌므로 브라우저 캐시 → 재다운로드 방지
    location /scanic-ml/ {
        types {
            application/javascript mjs;
            application/wasm wasm;
            application/octet-stream ort;
        }
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Vite 빌드 산출물(assets/) — content-hash 파일명 → immutable 영구 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
