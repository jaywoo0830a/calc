<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Calc — High Precision (32 digits)</title>

    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Calc" />
    <meta name="theme-color" content="#f8f4eb" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

    <!-- Three.js + Mathbox2 -->
    <link rel="stylesheet" href="/lib/mathbox.css" />
    <script type="importmap">
      { "imports": { "three": "/lib/three.module.min.js", "three/addons/": "/lib/three-addons/" } }
    </script>
    <script type="module">
      import * as _THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      window.THREE = Object.assign({}, _THREE, { OrbitControls });
      try {
        await new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = '/lib/mathbox.min.js?v=' + Date.now();
          s.onload = resolve;
          s.onerror = () => reject(new Error('Failed to load /lib/mathbox.min.js'));
          document.head.appendChild(s);
        });
        window._mathboxReady = true;
      } catch (e) {
        console.error('Mathbox2 load failed:', e.message);
        window._mathboxError = e.message;
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
