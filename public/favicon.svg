<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b4735"/>
      <stop offset="100%" stop-color="#4d3122"/>
    </linearGradient>
  </defs>
  <!-- rounded background -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="url(#bg)"/>
  <!-- subtle border -->
  <rect x="1" y="1" width="30" height="30" rx="6" fill="none" stroke="#7a5240" stroke-width="0.5" opacity="0.5"/>
  <!-- two horizontal bars — equals / fraction symbol -->
  <rect x="7" y="11" width="18" height="3.5" rx="1.75" fill="#f8f4eb"/>
  <rect x="7" y="17.5" width="18" height="3.5" rx="1.75" fill="#f8f4eb"/>
</svg>
